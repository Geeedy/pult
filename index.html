<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<meta name="robots" content="noindex, nofollow">
<title>Вход</title>
<link rel="icon" href="data:,">
<script src="web-config.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#0d0d12;color:#82828c;
    font:15px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  form{width:min(320px,100%)}
  input{
    width:100%;background:#141419;border:1px solid #24242c;color:#c6c6cf;
    border-radius:8px;padding:15px 14px;font:inherit;outline:none;text-align:center;
    letter-spacing:3px;transition:border-color .2s, box-shadow .2s;
  }
  input:focus{border-color:#33333d;box-shadow:0 0 0 3px rgba(255,255,255,.03)}
  input::placeholder{color:#3c3c46;letter-spacing:1px}
  input.shake{animation:shake .32s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(3px)}
  }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <input id="k" type="password" inputmode="text" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false"
         placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autofocus>
</form>
<script>
"use strict";
/* Проверка ключа: SHA-256 от введённой строки сравнивается с эталоном.
   Неверный ввод — просто тихий сброс поля, без сообщений.
   Верный ключ сервер обменивает на токен устройства: с этого устройства
   страница входа больше не показывается (пока не нажать «ВЫЙТИ»). */
const HASH = "e5a171a04b3ba5f5870d9d14c1f2cbfc1f6eb661faf9c5243693b3591a198079";
const BACKEND = String(window.DSH_BACKEND || "").trim().replace(/\/+$/, "");

async function sha256(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

/* Веб-клиент Telegram входит сам, страница входа ему не нужна */
try {
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
    location.replace("app.html");
  }
} catch (e) {}

/* Уже запомненное устройство — сразу дальше, без пароля */
(async () => {
  try {
    const dev = localStorage.getItem("dsh_dev");
    if (dev) {
      const r = await fetch((BACKEND || "") + "/api/device/check", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ deviceToken: dev }),
      });
      if (r.ok) {
        const j = await r.json();
        if (j.ok) { location.replace("app.html"); return; }
      }
      localStorage.removeItem("dsh_dev");
    } else {
      const t = localStorage.getItem("dsh_token");
      if (t && (await sha256(t)) === HASH) location.replace("app.html");
    }
  } catch (e) {}
})();

const inp = document.getElementById("k");
let busy = false;

function fail() {
  inp.value = "";
  inp.classList.remove("shake");
  void inp.offsetWidth;
  inp.classList.add("shake");
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) return;
  const v = inp.value;
  let ok = false;
  try { ok = !!v && (await sha256(v)) === HASH; } catch (err) {}
  if (!ok) { fail(); return; }
  busy = true;
  /* ключ -> токен устройства (сервер запоминает это устройство) */
  let dev = null, rejected = false;
  try {
    const r = await fetch((BACKEND || "") + "/api/device/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: v }),
    });
    if (r.ok) { const j = await r.json(); dev = j.deviceToken || null; }
    else if (r.status === 401 || r.status === 403) rejected = true;
  } catch (err) { /* сервер недоступен — тихий оффлайн-фолбэк ниже */ }
  busy = false;
  if (rejected) { fail(); return; }
  try {
    if (dev) {
      localStorage.setItem("dsh_dev", dev);
      localStorage.removeItem("dsh_token");
    } else {
      localStorage.setItem("dsh_token", v); /* фолбэк, если сервер не ответился */
    }
  } catch (err) {}
  location.replace("app.html");
});
</script>
</body>
</html>
